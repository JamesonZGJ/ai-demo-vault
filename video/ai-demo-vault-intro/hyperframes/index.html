<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080,height=1920" />
    <title>AI Demo Vault — HyperFrames Opening</title>
    <style>
      :root {
        --canvas: #111111;
        --surface: #ffffff;
        --muted: #f0f0ec;
        --text: #f7f7f4;
        --accent: #1d4ed8;
        --mint: #9fe7d5;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--canvas); }
      body { overflow: hidden; font-family: Inter, "Segoe UI", system-ui, sans-serif; }

      #opening {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--canvas);
        color: var(--text);
      }

      .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 160px 84px 260px;
        gap: 42px;
      }

      .eyebrow { color: var(--mint); font-size: 22px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      .title { max-width: 850px; margin: 0; font-size: 104px; line-height: 1.02; letter-spacing: -.06em; font-weight: 900; }
      .title span { display: block; }
      .sub { max-width: 650px; margin: 0; color: #c8cbc7; font-size: 34px; line-height: 1.24; }

      .stack { position: relative; width: 100%; height: 590px; margin-top: -80px; }
      .card { position: absolute; width: 600px; border-radius: 30px; border: 1px solid rgba(255,255,255,.22); background: #fff; overflow: hidden; box-shadow: 0 28px 70px rgba(0,0,0,.44); }
      .card img { width: 100%; display: block; }
      .card-a { right: 20px; top: 26px; transform: rotate(5deg); }
      .card-b { left: 14px; top: 102px; transform: rotate(-7deg); }
      .card-c { left: 116px; top: 214px; transform: rotate(1deg); }
      .card-label { position: absolute; left: 28px; bottom: 22px; padding: 9px 15px; border-radius: 999px; background: rgba(17,17,17,.82); color: #fff; font-size: 18px; font-weight: 750; }

      .scan { position: absolute; left: -100px; top: 0; width: 16px; height: 100%; background: var(--accent); box-shadow: 0 0 36px rgba(29,78,216,.85); opacity: .75; }
      .grid { position: absolute; inset: 0; opacity: .18; background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px); background-size: 72px 72px; pointer-events: none; }
      .footer-label { position: absolute; left: 84px; bottom: 104px; color: #c8cbc7; font-size: 22px; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="opening" data-composition-id="ai-demo-vault-opening" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div class="grid" data-layout-ignore></div>
      <div class="scan" id="scan" data-layout-ignore></div>
      <main class="scene-content">
        <div class="eyebrow" id="eyebrow">AI DEMO VAULT</div>
        <h1 class="title" id="title"><span>每天都在刷到</span><span>惊艳的 <em style="font-style:normal;color:var(--mint)">AI Demo</em></span></h1>
        <p class="sub" id="sub">收藏很多，真正用进项目的却很少。</p>
        <div class="stack" id="stack">
          <div class="card card-a" id="card-a"><img src="capture/screenshots/glass-surface.png" alt="Glass Surface real page capture" /><span class="card-label">Glass Surface</span></div>
          <div class="card card-b" id="card-b"><img src="capture/screenshots/explore.png" alt="Explore real page capture" /><span class="card-label">Build Blocks</span></div>
          <div class="card card-c" id="card-c"><img src="capture/screenshots/home.png" alt="Home real page capture" /><span class="card-label">AI products</span></div>
        </div>
      </main>
      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        tl.fromTo('#eyebrow', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .35, ease: 'power3.out' }, .18);
        tl.fromTo('#title', { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: .58, ease: 'expo.out' }, .32);
        tl.fromTo('#sub', { x: -26, opacity: 0 }, { x: 0, opacity: 1, duration: .45, ease: 'power2.out' }, .62);
        tl.fromTo('#card-a', { x: 80, y: 48, opacity: 0, rotation: 12 }, { x: 0, y: 0, opacity: 1, rotation: 5, duration: .55, ease: 'back.out(1.2)' }, .58);
        tl.fromTo('#card-b', { x: -70, y: 52, opacity: 0, rotation: -13 }, { x: 0, y: 0, opacity: 1, rotation: -7, duration: .6, ease: 'power3.out' }, .76);
        tl.fromTo('#card-c', { y: 90, opacity: 0, scale: .95 }, { y: 0, opacity: 1, scale: 1, duration: .62, ease: 'sine.out' }, .92);
        tl.fromTo('#scan', { x: 0, opacity: 0 }, { x: 1180, opacity: .8, duration: .85, ease: 'power2.inOut' }, 1.45);
        window.__timelines['ai-demo-vault-opening'] = tl;
      </script>
    </div>
  </body>
</html>
